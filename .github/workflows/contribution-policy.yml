name: Contribution Policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  contribution-policy:
    name: Contribution policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test contribution policy
        run: node --test scripts/contribution-policy-checks.cjs
      - uses: actions/github-script@v7
        with:
          script: |
            const check = require('./scripts/contribution-policy.cjs');
            await check({ github, context, core });
